<!DOCTYPE html>

<body>
<div class="container">
<h1>图文工具帮助</h1>

<div class="card">
<h2>用途</h2>
<p>图文工具用于快速制作漫画里的装饰文字、拟声词和强调字效。选择预设后，再在画布中调整位置、大小、旋转和图层顺序。</p>
</div>

<div class="card">
<h2>预设效果</h2>
<ul>
<li><strong>Shadow</strong>：适合普通强调文字，阴影能让文字从背景里跳出来。</li>
<li><strong>Wild</strong>：适合冲击、惊讶、战斗、爆发类拟声词。</li>
<li><strong>Scratch</strong>：适合紧张、撕裂、噪声、速度线附近的文字效果。</li>
</ul>
</div>

<div class="card">
<h2>建议流程</h2>
<ul>
<li>先输入文字，再选择预设。</li>
<li>把文字放在不遮挡角色脸、手和关键动作的位置。</li>
<li>需要强冲击力时，可配合网点、速度线或特效层使用。</li>
<li>导出前检查小字号是否可读，避免贴边或压到分镜边框。</li>
</ul>
</div>
</div>
</body>
</html>
