name: Manga-NAI-GPT full acceptance (offline)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "99_server.py"
      - "gpt_image_proxy.py"
      - "js/ai/gpt-region-editor.js"
      - "scripts/gpt-*"
      - "start_manga_editor_nai.ps1"
      - ".github/workflows/manga-full-acceptance.yml"
  push:
    branches: ["feat/manga-nai-gpt-region-editor"]
    paths:
      - "99_server.py"
      - "gpt_image_proxy.py"
      - "js/ai/gpt-region-editor.js"
      - "scripts/gpt-*"
      - "start_manga_editor_nai.ps1"
      - ".github/workflows/manga-full-acceptance.yml"

permissions:
  contents: read

jobs:
  regression:
    name: Legacy regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run non-billable project regression tests
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for name in \
            test test:manga-import test:simulator test:cutout test:brushes \
            test:assets test:simulator-extra test:story-engine test:page-studio \
            test:timeline test:image2 test:scene-plan test:proxy-guards \
            test:layout test:page-size test:fabric-text-focus test:image-export \
            test:png-bit-depth test:image-export-integration check-translations
          do
            echo "::group::npm run $name"
            if npm run "$name"; then
              echo "PASS $name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL $name" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures legacy suites failed"; exit 1
          fi
      - name: Python color-key background removal
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python scripts/cutout-color-key-smoke-test.py

  http:
    name: Live localhost HTTP / security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax / contract / HTTP server
        run: |
          python -m py_compile 99_server.py gpt_image_proxy.py
          python scripts/gpt-image-proxy-smoke-test.py
          python scripts/gpt-http-integration-test.py
          python scripts/proxy-guard-smoke-test.py

  browser:
    name: Real Chromium interaction (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual manga editor browser controls
        run: node scripts/gpt-browser-acceptance.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-gpt-browser-screenshots
          path: artifacts/gpt-browser/
          if-no-files-found: ignore

  windows-portable:
    name: Windows startup / portable ZIP check
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: PowerShell launcher syntax and required GPT wiring
        shell: pwsh
        run: |
          $errorItems = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "start_manga_editor_nai.ps1"), [ref]$null, [ref]$errorItems)
          if ($errorItems.Count -gt 0) { throw ($errorItems | Out-String) }
          $content = Get-Content "start_manga_editor_nai.ps1" -Raw
          if (-not $content.Contains('Get-EnvValue "GPT_IMAGE_TRUSTED_BASE_URL"')) {
            throw "Trusted endpoint is not loaded"
          }
      - name: Windows proxy contracts and HTTP checks
        shell: pwsh
        run: |
          python -m py_compile 99_server.py gpt_image_proxy.py
          python scripts/gpt-image-proxy-smoke-test.py
          if ($LASTEXITCODE -ne 0) { throw "GPT proxy contract failed" }
          python scripts/gpt-http-integration-test.py
          if ($LASTEXITCODE -ne 0) { throw "HTTP integration failed" }
          python scripts/proxy-guard-smoke-test.py
          if ($LASTEXITCODE -ne 0) { throw "Legacy proxy guards failed" }
      - name: Build and inspect portable ZIP
        shell: pwsh
        run: |
          ./scripts/make-one-click-zip.ps1 -SkipDesktop -Version 1.0.3-gpt-audit
          if ($LASTEXITCODE -ne 0) { throw "ZIP packaging failed" }
          Add-Type -AssemblyName System.IO.Compression
          $zipFile = Get-ChildItem "dist/Manga-Editor-Desu-NAI-1.0.3-gpt-audit.zip" | Select-Object -First 1
          if (-not $zipFile) { throw "ZIP missing" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFile.FullName)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($suffix in @('/gpt_image_proxy.py','/99_server.py',
                                  '/js/ai/gpt-region-editor.js','/css/gpt-region-editor.css',
                                  '/start_manga_editor_nai.ps1','/index.html')) {
              if (-not ($names | Where-Object { $_.EndsWith($suffix) })) {
                throw "Missing packaged component: $suffix"
              }
            }
            Write-Host "ZIP valid, entries:" $zip.Entries.Count
          } finally {
            $zip.Dispose()
          }
