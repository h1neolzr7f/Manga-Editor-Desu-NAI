name: Windows offline checks

# Static Windows readiness: unit tests + launcher syntax/encoding on windows-latest.
# Not a substitute for a real Windows run (no GUI, no local AI models, no real double-click).
on:
  pull_request:
  push:
    branches:
      - "consolidate/manga-nai-gpt-stack-20261010"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Node unit tests (npm test)
        shell: pwsh
        run: |
          npm test
      - name: Python syntax + unit tests (no native Tesseract / models on the runner)
        shell: pwsh
        env:
          PYTHONUTF8: "0"   # keep the Windows default codepage to catch missing encoding= bugs
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python -m py_compile 99_server.py gpt_image_proxy.py manga_smart_ocr.py manga_model_guard.py manga_character_detect.py manga_sam_select.py manga_text_detector.py manga_lama_inpaint.py manga_ocr_refiner.py manga_ocr_preclean.py manga_bubble_ocr.py prompt_helper_images.py
          $tests = @('manga-smart-ocr-test.py','manga-ocr-refiner-test.py','manga-lama-inpaint-test.py','manga-lama-pixel-test.py','manga-ocr-preclean-test.py','manga-bubble-ocr-test.py','manga-model-guard-test.py','manga-text-detector-test.py','manga-sam-select-test.py','manga-character-detect-test.py','gpt-image-proxy-smoke-test.py','prompt-helper-images-test.py')
          foreach ($t in $tests) { Write-Host "== $t"; python "scripts/$t"; if ($LASTEXITCODE -ne 0) { throw "$t failed" } }
      - name: Launchers parse (PowerShell) and ship as CRLF + BOM in the ZIP download
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -File | Where-Object { $_.FullName -notmatch 'node_modules' }) {
            $err = $null; [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err) { throw "$($f.Name): $($err[0].Message)" } else { Write-Host "parse ok $($f.Name)" }
          }
          git archive --format=zip -o $env:RUNNER_TEMP\src.zip HEAD
          Expand-Archive $env:RUNNER_TEMP\src.zip -DestinationPath $env:RUNNER_TEMP\src
          foreach ($f in Get-ChildItem $env:RUNNER_TEMP\src -Recurse -Include *.bat,*.ps1 -File) {
            $b = [IO.File]::ReadAllBytes($f.FullName); $lf = 0; $crlf = 0
            for ($i = 0; $i -lt $b.Length; $i++) { if ($b[$i] -eq 10) { if ($i -gt 0 -and $b[$i-1] -eq 13) { $crlf++ } else { $lf++ } } }
            if ($lf -gt 0) { throw "$($f.Name): $lf bare LF line endings in the ZIP" }
            if ($f.Extension -eq '.ps1' -and -not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { throw "$($f.Name): .ps1 without UTF-8 BOM (Windows PowerShell 5.1 would misread Chinese text)" }
            Write-Host "ok $($f.Name) ($crlf CRLF)"
          }
